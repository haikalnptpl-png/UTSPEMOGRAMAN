<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Laundry — Sistem Administrasi Transaksi</title>
<style>
/* ============================ DESIGN SYSTEM ============================ */
:root{
  --primary:#2563EB; --primary-d:#1D4ED8; --accent:#06B6D4;
  --ink:#0F172A; --muted:#64748B; --line:#E2E8F0; --bg:#F8FAFC;
  --ok:#16A34A; --err:#DC2626; --warn:#D97706;
  --radius:14px; --shadow:0 6px 20px rgba(15,23,42,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  background:radial-gradient(1100px 520px at 12% -12%,rgba(37,99,235,.10),transparent 60%),
             radial-gradient(900px 480px at 92% -6%,rgba(6,182,212,.12),transparent 62%),var(--bg);
  color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#94A3B8}

/* ============================ LAYOUT ============================ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:264px;flex:0 0 264px;
  background:linear-gradient(180deg,#0B1B36 0%,#10254A 55%,#0E2A4D 100%);
  color:#E2E8F0;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:.75rem;padding:1.5rem 1.25rem 1.1rem}
.brand-logo{
  width:46px;height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:center;
  font-size:1.45rem;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--accent));
  box-shadow:0 8px 20px rgba(37,99,235,.45);
}
.brand-text{line-height:1.15}
.brand-name{font-weight:800;font-size:1.02rem;color:#fff;letter-spacing:.2px}
.brand-sub{font-size:.66rem;color:#93C5FD;letter-spacing:.13em;text-transform:uppercase}
.nav-label{font-size:.66rem;letter-spacing:.16em;color:#64748B;font-weight:700;padding:1rem 1.25rem .5rem}
.nav-item{
  display:flex;align-items:center;gap:.65rem;width:calc(100% - 1.5rem);margin:0 .75rem .3rem;
  padding:.65rem .85rem;border-radius:12px;border:0;background:transparent;color:#CBD5E1;
  font-family:inherit;font-size:.92rem;font-weight:600;cursor:pointer;text-align:left;
  transition:background .16s ease,transform .16s ease,box-shadow .16s ease;
}
.nav-item:hover{background:rgba(255,255,255,.08);transform:translateX(3px)}
.nav-item.active{
  background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;
  box-shadow:0 6px 16px rgba(37,99,235,.42);
}
.sidebar-foot{margin-top:auto;padding:1.25rem;font-size:.76rem;color:#94A3B8;line-height:1.65}
.sidebar-foot code{background:rgba(255,255,255,.1);padding:.1rem .35rem;border-radius:5px;color:#CBD5E1;font-size:.72rem}
.link-btn{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#CBD5E1;
  border-radius:9px;padding:.4rem .7rem;font-family:inherit;font-size:.74rem;font-weight:600;
  cursor:pointer;width:100%;margin-top:.5rem;transition:background .16s ease;
}
.link-btn:hover{background:rgba(255,255,255,.16)}

.main{flex:1;min-width:0;padding:2.1rem 2.4rem 3rem;max-width:1500px;margin:0 auto}

/* ============================ HERO ============================ */
.hero{
  display:flex;align-items:center;gap:1rem;background:linear-gradient(120deg,#1D4ED8 0%,#2563EB 45%,#06B6D4 100%);
  border-radius:20px;padding:1.35rem 1.6rem;box-shadow:0 16px 38px rgba(37,99,235,.28);margin-bottom:1.35rem;
}
.hero-emoji{font-size:2.4rem;line-height:1;background:rgba(255,255,255,.18);padding:.6rem .75rem;border-radius:16px;border:1px solid rgba(255,255,255,.28)}
.hero-title{font-weight:800;font-size:1.5rem;color:#fff;line-height:1.2}
.hero-desc{color:rgba(255,255,255,.88);font-size:.88rem;margin-top:.2rem}

/* ============================ SECTION ============================ */
.section-title{display:flex;align-items:center;gap:.55rem;font-weight:700;font-size:1.03rem;margin:.9rem 0 .6rem}
.section-title .bar{display:inline-block;width:5px;height:20px;border-radius:4px;background:linear-gradient(180deg,var(--primary),var(--accent))}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:1.15rem 1.25rem}
.card.pad{padding:1.25rem 1.4rem}
.card h3{font-size:.98rem;font-weight:700;margin-bottom:.85rem}

/* ============================ METRIC ============================ */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1rem}
.metrics.three{grid-template-columns:repeat(3,1fr)}
.metric{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:1.05rem 1.15rem;
  box-shadow:var(--shadow);transition:transform .16s ease,box-shadow .16s ease;
}
.metric:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(15,23,42,.11)}
.metric-label{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.metric-value{font-size:1.6rem;font-weight:800;margin-top:.25rem;line-height:1.15}
.metric-delta{font-size:.78rem;color:var(--muted);margin-top:.3rem;display:flex;align-items:center;gap:.3rem}

/* ============================ GRID ============================ */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;margin-bottom:1.1rem}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.metrics,.metrics.three{grid-template-columns:1fr}.main{padding:1.2rem 1rem 2rem}.sidebar{display:none}}

/* ============================ TABEL ============================ */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 16px rgba(15,23,42,.05)}
table{width:100%;border-collapse:collapse;font-size:.87rem;background:#fff}
thead th{
  background:#F1F5F9;text-align:left;padding:.7rem .9rem;font-size:.72rem;font-weight:800;
  text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--line);
}
tbody td{padding:.65rem .9rem;border-bottom:1px solid #F1F5F9;color:var(--ink);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#F8FAFC}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:.16rem .6rem;border-radius:999px;font-size:.73rem;font-weight:700}
.badge-ok{background:#DCFCE7;color:#15803D}
.badge-off{background:#F1F5F9;color:#64748B}
.empty{padding:2.2rem 1rem;text-align:center;color:var(--muted);font-size:.9rem;background:#fff;border:1px dashed var(--line);border-radius:14px}

/* ============================ BAR CHART ============================ */
.chart{display:flex;align-items:flex-end;gap:.9rem;height:250px;padding:1rem .5rem 0;border-bottom:1px solid var(--line)}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:.45rem}
.chart-bar{
  width:100%;max-width:64px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--primary),var(--primary-d));
  transition:height .5s cubic-bezier(.4,0,.2,1);position:relative;
}
.chart-bar:hover{filter:brightness(1.12)}
.chart-bar .tip{
  position:absolute;top:-26px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  font-size:.7rem;padding:.2rem .45rem;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;
}
.chart-bar:hover .tip{opacity:1}
.chart-label{font-size:.72rem;color:var(--muted);font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ============================ FORM ============================ */
.form-grid{display:grid;gap:.85rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.85rem}
@media(max-width:700px){.row2,.row3{grid-template-columns:1fr}}
label{display:block;font-weight:700;font-size:.8rem;color:var(--ink);margin-bottom:.3rem}
label .req{color:var(--err)}
input,select,textarea{
  width:100%;padding:.6rem .75rem;border:1px solid #CBD5E1;border-radius:10px;font-family:inherit;
  font-size:.88rem;color:var(--ink);background:#fff;transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
input.invalid,select.invalid{border-color:var(--err)}
.hint{font-size:.75rem;color:var(--muted);margin-top:.25rem}
.check{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:.85rem;cursor:pointer}
.check input{width:auto;margin:0}

/* ============================ BUTTON ============================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.6rem 1.1rem;border-radius:11px;
  border:1px solid transparent;font-family:inherit;font-size:.87rem;font-weight:700;cursor:pointer;
  transition:transform .14s ease,box-shadow .14s ease,filter .14s ease;white-space:nowrap;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(37,99,235,.22)}
.btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.32)}
.btn-primary:hover{box-shadow:0 10px 22px rgba(37,99,235,.42)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-danger{background:#fff;border-color:#FCA5A5;color:var(--err)}
.btn-danger:hover{background:#FEF2F2;border-color:var(--err)}
.btn-sm{padding:.35rem .65rem;font-size:.78rem;border-radius:8px}
.btn-block{width:100%}
.btn-row{display:flex;gap:.6rem;flex-wrap:wrap}

/* ============================ TABS ============================ */
.tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--line);margin-bottom:1.1rem;overflow-x:auto}
.tab{
  padding:.55rem .95rem;border:0;background:transparent;font-family:inherit;font-size:.88rem;font-weight:700;
  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;
  transition:color .15s,border-color .15s;
}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-panel{display:none;animation:fade .22s ease}
.tab-panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============================ NOTA ============================ */
.nota{background:#fff;border:1px solid var(--line);border-radius:18px;padding:1.25rem 1.4rem;box-shadow:0 8px 26px rgba(15,23,42,.07)}
.nota-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;border-bottom:2px dashed var(--line);padding-bottom:.8rem;margin-bottom:.9rem;flex-wrap:wrap}
.nota-kode{font-weight:800;font-size:1.2rem}
.nota-total{font-weight:800;font-size:1.35rem;color:var(--primary);text-align:right}
.nota-meta{font-size:.85rem;color:var(--muted);line-height:1.6;margin-top:.15rem}
.nota-kaki{margin-top:.9rem;padding-top:.8rem;border-top:2px dashed var(--line);font-size:.8rem;color:var(--muted);text-align:center}
.total-box{
  background:linear-gradient(120deg,#1D4ED8,#06B6D4);border-radius:16px;padding:1.05rem 1.3rem;color:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
}
.total-box .tl{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.total-box .ts{font-size:.85rem;opacity:.9;margin-top:.15rem}
.total-box .tv{font-size:1.85rem;font-weight:800;white-space:nowrap}

/* ============================ KERANJANG ============================ */
.cart-qty{display:inline-flex;align-items:center;gap:.45rem}
.qty-btn{
  width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--primary);
  font-weight:800;font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;
  transition:background .14s,border-color .14s;
}
.qty-btn:hover{background:#EFF6FF;border-color:var(--primary)}
.qty-val{min-width:44px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* ============================ ALERT / TOAST ============================ */
.alert{padding:.8rem 1rem;border-radius:12px;font-size:.87rem;font-weight:600;border:1px solid transparent;margin-bottom:1rem}
.alert-success{background:#F0FDF4;color:#15803D;border-color:#BBF7D0}
.alert-error{background:#FEF2F2;color:#B91C1C;border-color:#FECACA}
.alert-info{background:#EFF6FF;color:#1D4ED8;border-color:#BFDBFE}
.alert-warn{background:#FFFBEB;color:#B45309;border-color:#FDE68A}
#toasts{position:fixed;top:1.2rem;right:1.2rem;z-index:9999;display:flex;flex-direction:column;gap:.6rem}
.toast{
  background:#fff;border-left:4px solid var(--ok);border-radius:12px;padding:.8rem 1.1rem;box-shadow:0 12px 32px rgba(15,23,42,.16);
  font-size:.87rem;font-weight:600;max-width:380px;animation:slideIn .28s cubic-bezier(.4,0,.2,1);
}
.toast.error{border-left-color:var(--err)}
.toast.info{border-left-color:var(--primary)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}

/* ============================ MODAL ============================ */
.modal-bg{
  position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);z-index:900;
  display:none;align-items:center;justify-content:center;padding:1.5rem;
}
.modal-bg.open{display:flex;animation:fade .2s ease}
.modal{
  background:#fff;border-radius:20px;max-width:620px;width:100%;max-height:90vh;overflow-y:auto;
  box-shadow:0 24px 60px rgba(15,23,42,.3);animation:pop .25s cubic-bezier(.4,0,.2,1);
}
.modal.wide{max-width:900px}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:none}}
.modal-head{
  padding:1.15rem 1.4rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
  align-items:center;position:sticky;top:0;background:#fff;border-radius:20px 20px 0 0;z-index:2;
}
.modal-title{font-weight:800;font-size:1.1rem}
.modal-close{
  border:0;background:#F1F5F9;width:32px;height:32px;border-radius:9px;font-size:1.1rem;cursor:pointer;color:var(--muted);
  display:flex;align-items:center;justify-content:center;transition:background .15s;
}
.modal-close:hover{background:#E2E8F0}
.modal-body{padding:1.4rem}
.modal-foot{padding:1rem 1.4rem;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:.6rem;background:#FCFDFE;border-radius:0 0 20px 20px}

/* ============================ MISC ============================ */
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;border-bottom:1px dashed var(--line);font-size:.87rem}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:700;text-align:right}
.mini-bar{height:7px;border-radius:4px;background:linear-gradient(90deg,var(--primary),var(--accent));min-width:3px}
.list-pill{
  display:inline-block;background:#F1F5F9;border-radius:8px;padding:.3rem .6rem;font-size:.8rem;font-weight:600;
  color:var(--ink);margin:.15rem .2rem .15rem 0;
}
.muted{color:var(--muted)}
.small{font-size:.8rem}
.spacer{margin-top:1rem}
</style>
</head>

const KUNCI = 'ultralaundry_db_v1';
let DB = null;

function muatDB(){
  try{
    const mentah = localStorage.getItem(KUNCI);
    if(mentah){ DB = JSON.parse(mentah); return; }
  }catch(e){ /* localStorage tidak tersedia -> pakai seed */ }
  DB = JSON.parse(JSON.stringify(SEED));
  simpanDB();
}
function simpanDB(){
  try{ localStorage.setItem(KUNCI, JSON.stringify(DB)); }catch(e){}
}
function resetData(){
  if(!confirm('Kembalikan semua data ke kondisi awal? Semua perubahan akan hilang.')) return;
  DB = JSON.parse(JSON.stringify(SEED));
  simpanDB();
  toast('Data dikembalikan ke kondisi awal','info');
  render();
}

/* ---------------------------------------------------------------- utils */
function rp(n){ return 'Rp' + Math.round(Number(n)||0).toLocaleString('id-ID'); }
function fmtBerat(n){ const v = Number(n)||0; return (Math.round(v*100)/100).toString(); }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function today(){ return new Date().toISOString().slice(0,10); }
function tglIndo(iso){
  if(!iso) return '-';
  const [y,m,d] = iso.split('-');
  const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  return `${d} ${bulan[Number(m)-1]} ${y}`;
}
function toast(pesan, jenis='sukses'){
  const el = document.createElement('div');
  el.className = 'toast' + (jenis==='error'?' error':jenis==='info'?' info':'');
  el.innerHTML = pesan;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s,transform .3s'; el.style.opacity='0'; el.style.transform='translateX(40px)'; setTimeout(()=>el.remove(),300); }, 3600);
}

/* ---------------------------------------------------------- query layer */
const Q = {
  kategori:   () => DB.kategori,
  layanan:    () => DB.layanan,
  pelanggan:  () => DB.pelanggan,
  layananAktif: () => DB.layanan.filter(l => l.aktif === 1),
  kategoriById: id => DB.kategori.find(k => k.id_kategori === id),
  layananById:  id => DB.layanan.find(l => l.id_layanan === id),
  pelangganById:id => DB.pelanggan.find(p => p.id_pelanggan === id),
  /* total nota dihitung dinamis dari detail_transaksi */
  detailNota: idTrx => DB.detail_transaksi.filter(d => d.id_transaksi === idTrx),
  subtotal: idTrx => Q.detailNota(idTrx).reduce((s,d) => s + d.berat * d.harga_satuan, 0),
  totalNota: idTrx => Q.subtotal(idTrx),
  totalPendapatan: () => DB.detail_transaksi.reduce((s,d) => s + d.berat * d.harga_satuan, 0),
  totalBerat: () => DB.detail_transaksi.reduce((s,d) => s + d.berat, 0),
  jumlahTransaksi: () => DB.transaksi.length,
  riwayatPelanggan: idPel => DB.transaksi.filter(t => t.id_pelanggan === idPel)
                            .sort((a,b) => b.tanggal.localeCompare(a.tanggal) || b.id_transaksi - a.id_transaksi),
  kodeNotaBerikutnya: () => {
    let maks = 0;
    DB.transaksi.forEach(t => {
      const m = String(t.kode_nota).match(/^NOTA-(\d+)$/);
      if(m) maks = Math.max(maks, parseInt(m[1],10));
    });
    return 'NOTA-' + String(maks+1).padStart(3,'0');
  },
  nextId(arr, key){
    return arr.reduce((m,x) => Math.max(m, Number(x[key])||0), 0) + 1;
  }
};

/* ---------------------------------------------------------- mutasi data */
function tambahPelanggan(nama, noHp, alamat){
  noHp = noHp.trim();
  if(!nama.trim() || !noHp || !alamat.trim()) return {ok:false, pesan:'Nama, nomor HP, dan alamat wajib diisi.'};
  if(!/^\d+$/.test(noHp)) return {ok:false, pesan:'Nomor HP harus berupa angka saja.'};
  if(noHp.length < 10 || noHp.length > 14) return {ok:false, pesan:'Nomor HP harus terdiri dari 10 sampai 14 digit.'};
  if(DB.pelanggan.some(p => p.no_hp.toLowerCase() === noHp.toLowerCase()))
    return {ok:false, pesan:`Nomor HP ${noHp} sudah terdaftar. Gunakan nomor lain.`};
  DB.pelanggan.push({id_pelanggan: Q.nextId(DB.pelanggan,'id_pelanggan'), nama_pelanggan: nama.trim(), no_hp: noHp, alamat: alamat.trim()});
  simpanDB(); return {ok:true, pesan:`Pelanggan ${nama.trim()} berhasil disimpan.`};
}
function ubahPelanggan(id, nama, noHp, alamat){
  noHp = noHp.trim();
  if(!nama.trim() || !noHp || !alamat.trim()) return {ok:false, pesan:'Nama, nomor HP, dan alamat wajib diisi.'};
  if(!/^\d+$/.test(noHp)) return {ok:false, pesan:'Nomor HP harus berupa angka saja.'};
  if(noHp.length < 10 || noHp.length > 14) return {ok:false, pesan:'Nomor HP harus terdiri dari 10 sampai 14 digit.'};
  if(DB.pelanggan.some(p => p.no_hp.toLowerCase() === noHp.toLowerCase() && p.id_pelanggan !== id))
    return {ok:false, pesan:`Nomor HP ${noHp} sudah dipakai pelanggan lain.`};
  const p = Q.pelangganById(id);
  if(!p) return {ok:false, pesan:'Pelanggan tidak ditemukan.'};
  Object.assign(p, {nama_pelanggan:nama.trim(), no_hp:noHp, alamat:alamat.trim()});
  simpanDB(); return {ok:true, pesan:'Data pelanggan berhasil diperbarui.'};
}
function hapusPelanggan(id){
  if(DB.transaksi.some(t => t.id_pelanggan === id))
    return {ok:false, pesan:'Pelanggan masih memiliki nota transaksi, jadi tidak bisa dihapus.'};
  DB.pelanggan = DB.pelanggan.filter(p => p.id_pelanggan !== id);
  simpanDB(); return {ok:true, pesan:'Pelanggan berhasil dihapus.'};
}

function tambahLayanan(kode, nama, satuan, tarif, idKat){
  kode = (kode||'').trim().toUpperCase(); nama = (nama||'').trim(); satuan = (satuan||'kg').trim();
  if(!kode || !nama || !satuan) return {ok:false, pesan:'Kode, nama layanan, dan satuan wajib diisi.'};
  if(DB.layanan.some(l => l.kode_layanan.toLowerCase() === kode.toLowerCase()))
    return {ok:false, pesan:`Kode layanan ${kode} sudah dipakai.`};
  if(tarif < 0) return {ok:false, pesan:'Harga satuan tidak boleh negatif.'};
  DB.layanan.push({id_layanan: Q.nextId(DB.layanan,'id_layanan'), kode_layanan:kode, nama_layanan:nama, satuan, tarif_per_kg:Number(tarif), id_kategori:idKat, aktif:1});
  simpanDB(); return {ok:true, pesan:`Layanan ${nama} berhasil disimpan.`};
}
function ubahLayanan(id, kode, nama, satuan, tarif, idKat){
  kode = (kode||'').trim().toUpperCase(); nama = (nama||'').trim(); satuan = (satuan||'kg').trim();
  if(!kode || !nama || !satuan) return {ok:false, pesan:'Kode, nama layanan, dan satuan wajib diisi.'};
  if(DB.layanan.some(l => l.kode_layanan.toLowerCase() === kode.toLowerCase() && l.id_layanan !== id))
    return {ok:false, pesan:`Kode layanan ${kode} sudah dipakai.`};
  const l = Q.layananById(id);
  if(!l) return {ok:false, pesan:'Layanan tidak ditemukan.'};
  Object.assign(l, {kode_layanan:kode, nama_layanan:nama, satuan, tarif_per_kg:Number(tarif), id_kategori:idKat});
  simpanDB(); return {ok:true, pesan:'Layanan berhasil diperbarui.'};
}
function hapusLayanan(id){
  if(DB.detail_transaksi.some(d => d.id_layanan === id))
    return {ok:false, pesan:'Layanan sudah dipakai nota lama, jadi tidak bisa dihapus. Gunakan status Nonaktif.'};
  DB.layanan = DB.layanan.filter(l => l.id_layanan !== id);
  simpanDB(); return {ok:true, pesan:'Layanan berhasil dihapus.'};
}
function setAktifLayanan(id, aktif){
  const l = Q.layananById(id);
  if(!l) return {ok:false, pesan:'Layanan tidak ditemukan.'};
  l.aktif = aktif ? 1 : 0;
  simpanDB(); return {ok:true, pesan:`Status layanan diubah menjadi ${aktif?'Aktif':'Nonaktif'}.`};
}
/* Simpan nota: berat layanan sama digabung, harga_satuan disalin dari tarif saat itu */
function simpanTransaksi(kodeNota, tanggal, idPelanggan, keranjang){
  kodeNota = (kodeNota||'').trim().toUpperCase();
  if(!kodeNota) return {ok:false, pesan:'Kode nota wajib diisi.'};
  if(!keranjang.length) return {ok:false, pesan:'Nota wajib memuat minimal satu baris cucian.'};
  if(DB.transaksi.some(t => t.kode_nota.toLowerCase() === kodeNota.toLowerCase()))
    return {ok:false, pesan:`Kode nota ${kodeNota} sudah dipakai.`};
  const gabung = {};
  keranjang.forEach(i => { gabung[i.id_layanan] = (gabung[i.id_layanan]||0) + Number(i.berat); });
  const idTrx = Q.nextId(DB.transaksi,'id_transaksi');
  DB.transaksi.push({id_transaksi:idTrx, kode_nota:kodeNota, tanggal, id_pelanggan:idPelanggan});
  Object.entries(gabung).forEach(([idLay, berat]) => {
    if(berat <= 0) return;
    const l = Q.layananById(Number(idLay));
    if(!l) return;
    DB.detail_transaksi.push({id_transaksi:idTrx, id_layanan:Number(idLay), berat:Number(berat), harga_satuan:l.tarif_per_kg});
  });
  simpanDB();
  return {ok:true, pesan:`Nota ${kodeNota} berhasil disimpan.`, id: kodeNota};
}

  const omzetHariIni = trxHariIni.reduce((s,t) => s + Q.totalNota(t.id_transaksi), 0);

  const perKat = DB.kategori.map(k => {
    const layIds = DB.layanan.filter(l => l.id_kategori === k.id_kategori).map(l => l.id_layanan);
    const v = DB.detail_transaksi.filter(d => layIds.includes(d.id_layanan))
                                 .reduce((s,d) => s + d.berat*d.harga_satuan, 0);

    else if(!Q.layananAktif().length){ isi = '<div class="alert alert-warn">⚠️ Belum ada layanan aktif. Tambahkan layanan dulu di menu <b>Kategori &amp; Layanan</b>.</div>'; }
    else {
      const total = CART.reduce((s,i) => s + i.berat*i.tarif, 0);

            </tr>`).join('')}</tbody></table></div>

      <div id="areaNota"></div>`;
  }

  return `

  /* pencarian langsung */
  const qp = document.getElementById('qPel');
  if(qp) qp.oninput = () => { const pos = qp.selectionStart; render(); const el = document.getElementById('qPel'); if(el){ el.focus(); el.setSelectionRange(pos,pos); } };

  if(qn) qn.oninput = () => { const pos = qn.selectionStart; render(); const el = document.getElementById('qNota'); if(el){ el.focus(); el.setSelectionRange(pos,pos); } };
  /* isi otomatis field ubah */
  const up = document.getElementById('upPilih');
  if(up){ up.onchange = () => isiFormUbah(up.value); isiFormUbah(up.value); }
  const hp = document.getElementById('hpPilih');
  if(hp){ hp.onchange = () => isiInfoHapus(hp.value); isiInfoHapus(hp.value); }

  const kk = document.getElementById('kKategori');

      <tbody>${trx.map(t => `<tr>
        <td><b>${esc(t.kode_nota)}</b></td>

/* ---------------------------------------------------------------- kasir */
function tambahKeKeranjang(){
  const idLay = Number(document.getElementById('kLayanan').value);
  const berat = Number(document.getElementById('kBerat').value);
  if(!idLay){ toast('❌ Pilih layanan terlebih dahulu.','error'); return; }
  if(!(berat > 0)){ toast('❌ Berat harus lebih dari 0 kg.','error'); return; }
  const l = Q.layananById(idLay);
  const kat = Q.kategoriById(l.id_kategori);
  const ada = CART.find(i => i.id_layanan === idLay);
  if(ada){ ada.berat += berat; toast(`ℹ️ Berat <b>${esc(l.nama_layanan)}</b> digabung menjadi ${fmtBerat(ada.berat)} kg.`,'info'); }
  else { CART.push({id_layanan:idLay, nama_layanan:l.nama_layanan, kategori:kat?.nama_kategori||'-', satuan:l.satuan, tarif:l.tarif_per_kg, berat}); toast(`✅ <b>${esc(l.nama_layanan)}</b> (${fmtBerat(berat)} kg) ditambahkan ke keranjang.`); }
  render();
}
function ubahQty(idx, delta){
  const i = CART[idx];
  i.berat = Math.round((i.berat + delta) * 100) / 100;
  if(i.berat <= 0){ CART.splice(idx,1); toast('🗑️ Item dihapus dari keranjang.','info'); }
  render();
}
function hapusItem(idx){ CART.splice(idx,1); toast('🗑️ Item dihapus dari keranjang.','info'); render(); }
function kosongkanKeranjang(){ if(!CART.length) return; CART = []; toast('🗑️ Keranjang dikosongkan.','info'); render(); }

/* -------------------------------------------------------------- unduh */
function unduhNota(kode){
  const t = DB.transaksi.find(x => x.kode_nota === kode);
  if(!t) return;
  const p = Q.pelangganById(t.id_pelanggan);
  const det = Q.detailNota(t.id_transaksi);
  const total = det.reduce((s,d) => s + d.berat*d.harga_satuan, 0);
  const garis = '='.repeat(58);
  const isi = [garis,'ULTRA LAUNDRY','Sistem Administrasi Transaksi',garis,
    `Kode Nota   : ${t.kode_nota}`, `Tanggal     : ${t.tanggal}`,
    `Pelanggan   : ${p?.nama_pelanggan||'-'} (${p?.no_hp||'-'})`, `Alamat      : ${p?.alamat||'-'}`,
    garis, `${'Kategori'.padEnd(12)}${'Layanan'.padEnd(22)}${'Berat'.padStart(8)}${'Subtotal'.padStart(14)}`, '-'.repeat(58)];
  det.forEach(d => {
    const l = Q.layananById(d.id_layanan); const k = Q.kategoriById(l?.id_kategori);
    isi.push(`${(k?.nama_kategori||'-').padEnd(12)}${(l?.nama_layanan||'-').padEnd(22)}${(fmtBerat(d.berat)+' '+l?.satuan).padStart(8)}${rp(d.berat*d.harga_satuan).padStart(14)}`);
  });
  isi.push('-'.repeat(58), `${'TOTAL'.padEnd(42)}${rp(total).padStart(14)}`, garis, 'Terima kasih sudah laundry di Ultra Laundry!');
  unduhFile(`nota_${kode}.txt`, isi.join('\n'), 'text/plain');
}

function unduhFile(nama, isi, tipe){
  const blob = new Blob([isi], {type: tipe || 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nama;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function eksporJSON(){
  unduhFile('ultralaundry_data.json', JSON.stringify(DB, null, 2), 'application/json');
  toast('⬇️ Data berhasil diunduh.','info');
}
